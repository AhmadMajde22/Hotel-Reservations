<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOTEL RESERVATION PREDICTION ❤️</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: url('{{ url_for("static", filename="background.jpg") }}') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2d3436;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .form-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            margin: 5px;
            padding: 10px;
            background-color: #0984e3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn.reset {
            background-color: #d63031;
        }

        .btn:hover {
            background-color: #74b9ff;
        }

        .btn.reset:hover {
            background-color: #ff7675;
        }

        .result {
            margin-top: 30px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .cancel {
            color: #d63031;
            font-weight: bold;
        }

        .no-cancel {
            color: #00b894;
            font-weight: bold;
        }

        .thanks {
            margin-top: 10px;
            color: #636e72;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Hotel Reservation Prediction</h1>
        <form method="post">
            <div class="form-group">
                <label for="lead_time">Lead Time</label>
                <input type="number" id="lead_time" name="lead_time" required min="0"
                    title="Days before check-in the reservation was made">
            </div>

            <div class="form-group">
                <label for="no_of_special_request">No. of Special Requests</label>
                <input type="number" id="no_of_special_request" name="no_of_special_request" required min="0">
            </div>

            <div class="form-group">
                <label for="avg_price_per_room">Average Price Per Room</label>
                <input type="number" id="avg_price_per_room" name="avg_price_per_room" required min="0" step="0.01">
            </div>

            <div class="form-group">
                <label for="arrival_month">Arrival Month</label>
                <select id="arrival_month" name="arrival_month" required>
                    {% set months = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
                    'August', 'September', 'October', 'November', 'December'] %}
                    {% for month in months %}
                    <option value="{{ loop.index }}">{{ month }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="arrival_date">Arrival Date</label>
                <select id="arrival_date" name="arrival_date" required>
                    {% for i in range(1, 32) %}
                    <option value="{{ i }}">{{ i }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="market_segment_type">Market Segment Type</label>
                <select id="market_segment_type" name="market_segment_type" required>
                    <option value="0">Aviation</option>
                    <option value="1">Complementary</option>
                    <option value="2">Corporate</option>
                    <option value="3">Offline</option>
                    <option value="4">Online</option>
                </select>
            </div>

            <div class="form-group">
                <label for="no_of_week_nights">No. of Week Nights</label>
                <input type="number" id="no_of_week_nights" name="no_of_week_nights" required min="0">
            </div>

            <div class="form-group">
                <label for="no_of_weekend_nights">No. of Weekend Nights</label>
                <input type="number" id="no_of_weekend_nights" name="no_of_weekend_nights" required min="0">
            </div>

            <div class="form-group">
                <label for="type_of_meal_plan">Type of Meal Plan</label>
                <select id="type_of_meal_plan" name="type_of_meal_plan" required>
                    <option value="0">Meal Plan 1</option>
                    <option value="1">Meal Plan 2</option>
                    <option value="2">Meal Plan 3</option>
                    <option value="3">Not Selected</option>
                </select>
            </div>

            <div class="form-group">
                <label for="room_type_reserved">Room Type Reserved</label>
                <select id="room_type_reserved" name="room_type_reserved" required>
                    <option value="0">Room Type 1</option>
                    <option value="1">Room Type 2</option>
                    <option value="2">Room Type 3</option>
                    <option value="3">Room Type 4</option>
                    <option value="4">Room Type 5</option>
                    <option value="5">Room Type 6</option>
                    <option value="6">Room Type 7</option>
                </select>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn">Predict</button>
                <button type="reset" class="btn reset">Reset</button>
            </div>
        </form>

        {% if prediction is not none %}
        <div class="result">
            {% if prediction == 0 %}
            <p class="cancel">The customer is <strong>going to cancel</strong> the reservation.</p>
            {% elif prediction == 1 %}
            <p class="no-cancel">The customer is <strong>not going to cancel</strong> the reservation.</p>
            {% endif %}
            <p class="thanks">Thank you for using our service!</p>
        </div>
        {% endif %}
    </div>
</body>

</html>
